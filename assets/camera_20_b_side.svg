<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
 
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">OV5640 Camera Sensor Window Mode - Side View</text>
 
  <!-- Camera body outline -->
  <rect x="100" y="170" width="150" height="100" fill="#888" stroke="#333" stroke-width="2" rx="5"/>
  
  <!-- Lens -->
  <rect x="50" y="190" width="50" height="60" fill="#555" stroke="#333" stroke-width="2" rx="10"/>
  <circle cx="75" cy="220" r="20" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="75" cy="220" r="12" fill="#222" stroke="#111" stroke-width="1"/>
  
  <!-- Sensor placement -->
  <rect x="200" y="185" width="10" height="70" fill="#aaa" stroke="#555" stroke-width="2"/>
  <text x="205" y="230" font-family="Arial" font-size="10" text-anchor="middle" transform="rotate(90,205,230)">Sensor</text>
  
  <!-- Center point of sensor -->
  <circle cx="205" cy="220" r="3" fill="#000"/>
  
  <!-- Vertical FOV centered at sensor middle with distance markers -->
  <path d="M 205 220 L 600 100 L 600 340 Z" stroke="#3498db" stroke-width="2" fill="rgba(52, 152, 219, 0.1)"/>
  <text x="400" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="#3498db">20° Vertical FOV</text>
  
  <!-- Window mode (reduced area) -->
  <rect x="200" y="210" width="10" height="30" stroke="#e74c3c" stroke-width="3" fill="rgba(231, 76, 60, 0.2)"/>
  
  <!-- Distance markers along center line -->
  <line x1="205" y1="220" x2="600" y2="220" stroke="#555" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Distance Line</text>
  
  <line x1="250" y1="215" x2="250" y2="225" stroke="#555" stroke-width="2"/>
  <text x="250" y="245" font-family="Arial" font-size="12" text-anchor="middle">5m</text>
  
  <line x1="350" y1="215" x2="350" y2="225" stroke="#555" stroke-width="2"/>
  <text x="350" y="245" font-family="Arial" font-size="12" text-anchor="middle">8m</text>
  
  <line x1="430" y1="215" x2="430" y2="225" stroke="#555" stroke-width="2"/>
  <text x="430" y="245" font-family="Arial" font-size="12" text-anchor="middle">10m</text>
  
  <line x1="510" y1="215" x2="510" y2="225" stroke="#555" stroke-width="2"/>
  <text x="510" y="245" font-family="Arial" font-size="12" text-anchor="middle">12m</text>
  
  <line x1="600" y1="215" x2="600" y2="225" stroke="#555" stroke-width="2"/>
  <text x="600" y="245" font-family="Arial" font-size="12" text-anchor="middle">15m</text>
  
  <!-- Upper and lower FOV bounds -->
  <line x1="205" y1="220" x2="600" y2="100" stroke="#3498db" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="205" y1="220" x2="600" y2="340" stroke="#3498db" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- FOV angle indicator -->
  <path d="M 230 210 A 30 30 0 0 1 230 230" stroke="#3498db" stroke-width="1.5" fill="none"/>
  <text x="245" y="225" font-family="Arial" font-size="12" text-anchor="start" fill="#3498db">20°</text>
  

  
  <!-- Legend -->
  <rect x="100" y="380" width="20" height="20" fill="#aaa" stroke="#555" stroke-width="2"/>
  <text x="130" y="395" font-family="Arial" font-size="14" text-anchor="start">Full Sensor (2592×1944 pixels)</text>
  
  <rect x="100" y="410" width="20" height="20" fill="rgba(231, 76, 60, 0.2)" stroke="#e74c3c" stroke-width="2"/>
  <text x="130" y="425" font-family="Arial" font-size="14" text-anchor="start">Window Mode (Reduced Area)</text>
  
  <path d="M 100 440 L 130 430 L 130 450 Z" fill="rgba(52, 152, 219, 0.2)" stroke="#3498db" stroke-width="2"/>
  <text x="140" y="445" font-family="Arial" font-size="14" text-anchor="start" fill="#3498db">20° Field of View</text>
  
  <line x1="400" y1="380" x2="435" y2="380" stroke="#555" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="490" y="385" font-family="Arial" font-size="14" text-anchor="start">Distance Line (5-15m)</text>
  
  <!-- Additional notes -->
  <text x="400" y="480" font-family="Arial" font-size="16" text-anchor="middle">Side view showing centered vertical FOV with distance measurements</text>
</svg>