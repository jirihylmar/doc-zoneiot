<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
 
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">OV5640 Camera Sensor Window Mode - Top View</text>
 
  <!-- Camera at origin -->
  <circle cx="400" cy="100" r="20" fill="#555" stroke="#333" stroke-width="2"/>
  <rect x="380" y="80" width="40" height="10" fill="#888" stroke="#333" stroke-width="1" rx="2"/>
  
  <!-- Full Sensor Area - simplified representation -->
  <rect x="370" y="100" width="60" height="40" stroke="#333" stroke-width="2" fill="none" rx="2"/>
  <text x="400" y="130" font-family="Arial" font-size="10" text-anchor="middle">Full Sensor</text>
  
  <!-- Window Mode Area - simplified representation -->
  <rect x="380" y="110" width="40" height="20" stroke="#e74c3c" stroke-width="2" fill="rgba(231, 76, 60, 0.2)" rx="2"/>
  <text x="400" y="150" font-family="Arial" font-size="10" text-anchor="middle" fill="#e74c3c">Window Mode</text>
  
  <!-- Horizontal FOV lines -->
  <line x1="400" y1="100" x2="300" y2="220" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="100" x2="500" y2="220" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- FOV angle indicator -->
  <path d="M 385 110 A 20 20 0 0 0 415 110" stroke="#3498db" stroke-width="1.5" fill="none"/>
  <text x="400" y="95" font-family="Arial" font-size="12" text-anchor="middle" fill="#3498db">20°</text>
  
  <!-- Distance markers along center line -->
  <line x1="400" y1="100" x2="400" y2="450" stroke="#555" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- FOV triangles at various distances -->
  <!-- 5m distance -->
  <line x1="320" y1="220" x2="480" y2="220" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="216" font-family="Arial" font-size="12" text-anchor="middle">5m</text>
  
  <!-- 8m distance -->
  <line x1="280" y1="280" x2="520" y2="280" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="276" font-family="Arial" font-size="12" text-anchor="middle">8m</text>
  
  <!-- 10m distance -->
  <line x1="250" y1="320" x2="550" y2="320" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="316" font-family="Arial" font-size="12" text-anchor="middle">10m</text>
  
  <!-- 12m distance -->
  <line x1="220" y1="360" x2="580" y2="360" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="356" font-family="Arial" font-size="12" text-anchor="middle">12m</text>
  
  <!-- 15m distance -->
  <line x1="180" y1="420" x2="620" y2="420" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="416" font-family="Arial" font-size="12" text-anchor="middle">15m</text>
  
  <!-- Road width indicator at 10m distance -->
  <line x1="320" y1="340" x2="480" y2="340" stroke="#333" stroke-width="4"/>
  <line x1="320" y1="335" x2="320" y2="345" stroke="#333" stroke-width="2"/>
  <line x1="480" y1="335" x2="480" y2="345" stroke="#333" stroke-width="2"/>
  <text x="400" y="335" font-family="Arial" font-size="14" text-anchor="middle" fill="white">5m Road Width</text>
  
  <!-- Blue FOV area -->
  <path d="M 400 100 L 180 420 L 620 420 Z" fill="rgba(52, 152, 219, 0.1)" stroke="none"/>
  
  <!-- Legend -->
  <rect x="600" y="150" width="20" height="20" fill="none" stroke="#333" stroke-width="2"/>
  <text x="630" y="165" font-family="Arial" font-size="14" text-anchor="start">Full Sensor</text>
  
  <rect x="600" y="180" width="20" height="20" fill="rgba(231, 76, 60, 0.2)" stroke="#e74c3c" stroke-width="2"/>
  <text x="630" y="195" font-family="Arial" font-size="14" text-anchor="start">Window Mode</text>
  
  <line x1="600" y1="210" x2="620" y2="210" stroke="#3498db" stroke-width="2"/>
  <text x="630" y="215" font-family="Arial" font-size="14" text-anchor="start" fill="#3498db">20° Horizontal FOV</text>
  
  <line x1="600" y1="240" x2="620" y2="240" stroke="#333" stroke-width="4"/>
  <text x="630" y="245" font-family="Arial" font-size="14" text-anchor="start">5m Road Width</text>
  
  <!-- Additional notes -->
  <text x="400" y="480" font-family="Arial" font-size="16" text-anchor="middle">Top view showing horizontal field of view with road width reference</text>
</svg>