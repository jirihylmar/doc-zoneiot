version: 1.0
frontend:
  phases:
    preBuild:
      commands:
        - python3 -m pip install --upgrade pip
        - export PATH="$PATH:/root/.local/bin"  # Add this line
        - python3 -m pip install -r requirements.txt --user
    build:
      commands:
        - export PATH="$PATH:/root/.local/bin"  # Add this line
        - mkdocs build --verbose
  artifacts:
    baseDirectory: site
    files:
      - '**/*'
  cache:
    paths:
      - ~/.cache/pip
      - ~/.local/lib/python3.10/site-packages